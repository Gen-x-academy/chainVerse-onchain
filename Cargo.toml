[workspace]
resolver = "2"

members = [
    "contracts/chv_token",
    "contracts/payment",
    "contracts/certificates",
    "contracts/escrow",
    "contracts/escrow-vault",
    "contracts/reward",
    "contracts/payout-automation",
    "contracts/chainverse-core",
    "contracts/chainverse-types",
    "contracts/course_registry",
    "contracts/shared",
    "contracts/common",
    "contracts/staking",
    "contracts/token",
]

[workspace.dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[profile.release]
opt-level      = "z"
overflow-checks = true
debug          = 0
strip          = "symbols"
panic          = "abort"
codegen-units  = 1
lto            = true
