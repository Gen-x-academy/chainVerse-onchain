name: Contracts CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@22.0.0 --features opt

      - name: Build all contracts
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run all unit tests
        working-directory: contracts
        run: cargo test --workspace

      # #1017: blocks a merge that pushes any library-rights entrypoint past
      # its share of Soroban's per-transaction CPU/memory limit. Ceilings and
      # the tolerance policy live in contracts/library-rights/src/tests/budgets.rs
      # and docs/library-rights-resource-budgets.md.
      - name: Resource budgets (library-rights)
        working-directory: contracts
        run: cargo test -p library-rights budgets

      # #1016: model check of the hold and loan state machines.
      - name: Model check (library-rights lending)
        working-directory: contracts
        run: cargo test -p library-rights model_check

      - name: Clippy (deny warnings)
        working-directory: contracts
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all -- --check
