# Permission model
# -----------------
# This workflow intentionally uses the least-privilege permission model.
#
# Workflow-level defaults are set to read-only (contents: read,
# pull-requests: read). The deploy job inherits those defaults and never
# writes back to the repository — it only uploads deployments/testnet.json
# as a GitHub Actions artifact.
#
# A second job (open-pr) is the only place with elevated permissions
# (contents: write, pull-requests: write). It runs after deploy succeeds,
# downloads the artifact, and opens a PR via peter-evans/create-pull-request
# so that any update to deployments/testnet.json goes through a normal
# review cycle rather than bypassing branch protection with a direct push.

name: Deploy Testnet

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Deny everything by default; individual jobs opt in to what they need.
permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    name: Build, Test & Deploy to Testnet
    runs-on: ubuntu-latest
    # Inherits workflow-level read-only permissions — no write access here.
    permissions:
      contents: read

    steps:
      # No token override — the default GITHUB_TOKEN with read-only scope is
      # sufficient for a plain checkout.
      - uses: actions/checkout@v4

      - name: Install Rust + WASM target
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@22.0.0 --features opt

      - name: Configure deployer identity
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: stellar keys generate deployer --secret-key "$STELLAR_SECRET_KEY"

      - name: Build all contracts
        working-directory: contracts
        run: make build

      - name: Run tests
        working-directory: contracts
        run: make test

      - name: Deploy to testnet
        run: bash scripts/deploy-testnet.sh

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      # Upload the updated deployments/testnet.json as a workflow artifact so
      # the open-pr job (and any human) can retrieve it without needing a
      # direct push to main.
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: testnet-deployment-${{ github.run_number }}
          path: deployments/testnet.json
          if-no-files-found: warn

  open-pr:
    name: Open PR to update deployments/testnet.json
    needs: [deploy]
    runs-on: ubuntu-latest
    # Only bother opening a PR for pushes to main or explicit workflow_dispatch
    # runs — not for PR-triggered builds on feature branches.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # Elevated permissions scoped to this job only.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: testnet-deployment-${{ github.run_number }}
          # Place the file back where it belongs in the repo tree.
          path: deployments

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update deployments/testnet.json [skip ci]"
          branch: chore/update-testnet-deployments
          title: "chore: update testnet deployment addresses"
          body: |
            Automated PR from testnet deployment run ${{ github.run_number }}.
            Review and merge to update contract addresses.
          add-paths: deployments/testnet.json
