name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@22.0.0 --features opt
      - name: Clippy (deny warnings)
        working-directory: contracts
        run: cargo clippy --workspace --all-targets -- -D warnings

  rustdoc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@22.0.0 --features opt
      - name: Build rustdoc (deny warnings)
        working-directory: contracts
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@22.0.0 --features opt
      - name: Build contracts
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Test with default features
        working-directory: contracts
        run: cargo test --workspace
      - name: Test with testutils feature
        working-directory: contracts
        run: cargo test --workspace --features testutils

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies for known advisories
        working-directory: contracts
        run: cargo audit

      - name: Test with default features
  wasm-size-budgets:
    name: WASM Size Budgets
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@22.0.0 --features opt
      - name: Build all contracts
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Check WASM size budgets
        working-directory: contracts
        run: |
          echo "=== WASM Size Report ==="
          MAX_SIZE_KB=500
          FAILED=0
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              NAME=$(basename "$wasm" .wasm)
              SIZE_BYTES=$(wc -c < "$wasm")
              SIZE_KB=$((SIZE_BYTES / 1024))
              echo "  $NAME: ${SIZE_KB} KB"
              if [ "$SIZE_KB" -gt "$MAX_SIZE_KB" ]; then
                echo "  FAIL: $NAME exceeds ${MAX_SIZE_KB} KB budget"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "WASM size budget check failed"
            exit 1
          fi
          echo "All WASM artifacts within budget"
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@22.0.0 --features opt
      - name: Build contracts
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Test contracts
        working-directory: contracts
        run: cargo test --workspace

      - name: Test with testutils feature
        working-directory: contracts
        run: cargo test --workspace --features testutils

      - name: Clippy (deny warnings)
        working-directory: contracts
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all -- --check

  wasm-size-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@22.0.0 --features opt

      - name: Build all contracts
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Check WASM size budgets
        working-directory: contracts
        run: |
          echo "=== WASM Size Report ==="
          MAX_SIZE_KB=500
          FAILED=0
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              NAME=$(basename "$wasm" .wasm)
              SIZE_BYTES=$(wc -c < "$wasm")
              SIZE_KB=$((SIZE_BYTES / 1024))
              echo "  $NAME: ${SIZE_KB} KB"
              if [ "$SIZE_KB" -gt "$MAX_SIZE_KB" ]; then
                echo "  FAIL: $NAME exceeds ${MAX_SIZE_KB} KB budget"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "WASM size budget check failed"
            exit 1
          fi
          echo "All WASM artifacts within budget"
