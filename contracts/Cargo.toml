[workspace]
resolver = "2"

members = [
    "certificates",
    "chainverse-core",
    "chainverse-types",
    "escrow",
    "escrow-vault",
    "payout-automation",
    "payment",
    "reward",
    "course_registry",
    "chv_token",
    "shared",
    "common",
    "staking",
    "token",
    "library-rights",
    "library_licensing",
    "scholarship-admin",
    "scholarship-applications",
    "scholarship-core",
    "scholarship-disbursements",
    "scholarship-eligibility",
    "scholarship-milestones",
    "scholarship-programs",
    "scholarship-registry",
    "scholarship-finance",
    "scholarship-dashboards",
    "scholarship-communications",
    "scholarship-disbursement-enhancements",
]

[workspace.dependencies]
soroban-sdk = "=22.0.11"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
