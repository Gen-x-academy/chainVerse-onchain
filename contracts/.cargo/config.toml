# NOTE: no `[build] target` default here. Forcing wasm32 as the default
# target made every plain `cargo test` compile test-only code (soroban-sdk
# testutils) for wasm, where those dependencies do not exist. WASM builds
# pass `--target wasm32-unknown-unknown` explicitly (see CI and
# `stellar contract build`).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
codegen-units = 1
