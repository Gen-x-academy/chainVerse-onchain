[package]
name = "library-fines"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
ed25519-dalek = { version = "=2.1.1", default-features = false }
soroban-sdk = { workspace = true }

[dev-dependencies]
ed25519-dalek = "=2.1.1"
soroban-sdk = { workspace = true, features = ["testutils"] }
