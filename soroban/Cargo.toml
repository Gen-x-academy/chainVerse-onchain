[workspace]
resolver = "2"
members = [
    "contracts/chainverse-types",
    "contracts/payment",
]

[workspace.dependencies]
soroban-sdk = "=21.7.6"

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = "symbols"
