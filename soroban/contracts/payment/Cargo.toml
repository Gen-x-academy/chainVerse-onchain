[package]
name = "chainverse-payment"
version = "0.1.0"
edition = "2021"
description = "ChainVerse Academy – Soroban payment configuration contract"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
chainverse-types = { path = "../chainverse-types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "chainverse-types/testutils"]
